name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compiler l'APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Hitihaunui-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publier l'APK dans Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Hitihaunui.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Hitihaunui.apk --title "Hitihaunui APK" --notes "Dernier APK compilé" --target ${{ github.sha }}
